name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install -e "./backend[dev]"
      - name: Start local Postgres
        run: |
          python scripts/run_db.py &
          for i in $(seq 1 30); do
            python -c "import psycopg; psycopg.connect('postgresql://postgres:postgres@127.0.0.1:5432/postgres')" 2>/dev/null && break
            sleep 1
          done
      - run: ruff check .
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
